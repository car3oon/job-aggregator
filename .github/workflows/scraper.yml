name: Job Aggregator Scraper

on:
  # Runs daily at 06:17 and 18:17 UTC from the default branch.
  # Avoid the start of the hour, when GitHub may delay or drop scheduled runs.
  schedule:
    - cron: '17 6,18 * * *'
  
  # Allows manual execution (from Actions tab or via API/Vercel button webhook)
  workflow_dispatch:

jobs:
  scrape:
    name: Run Scraper
    runs-on: ubuntu-26.04

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎭 Install Playwright Browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: 🗄️ Generate Prisma Client
        run: pnpm exec prisma generate

      - name: 🚀 Run Scraper Engine
        env:
          PRISMA_DATABASE_URL: ${{ secrets.PRISMA_DATABASE_URL }}
          TRIGGER_SOURCE: ${{ github.event_name }}
          PRACUJ_HEADLESS: "false"
        run: xvfb-run --auto-servernum pnpm dlx tsx src/scripts/scraper/run.ts
