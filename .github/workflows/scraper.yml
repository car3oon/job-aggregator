name: Job Aggregator Scraper

on:
  # Runs the script automatically every day at 6:00 AM and 6:00 PM (UTC)
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  
  # Allows manual execution (from Actions tab or via API/Vercel button webhook)
  workflow_dispatch:

jobs:
  scrape:
    name: Run Scraper
    runs-on: ubuntu-26.04

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 🚀 Run Scraper Engine
        env:
          PRISMA_DATABASE_URL: ${{ secrets.PRISMA_DATABASE_URL }}
          TRIGGER_SOURCE: ${{ github.event_name }}
        run: npx tsx src/scripts/scraper/run.ts
